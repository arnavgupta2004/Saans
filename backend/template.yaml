AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Saans - AQI-smart school timetables

Parameters:
  DataGovInApiKey:
    Type: String
    NoEcho: true
    Default: ''
  BedrockModelId:
    Type: String
    Default: us.amazon.nova-lite-v1:0
  ModelProvider:
    Type: String
    Default: bedrock
    AllowedValues: [bedrock, gemini]
  GeminiModelId:
    Type: String
    Default: gemini-3.8-flash
  GeminiFallbackModelId:
    Type: String
    Default: gemini-3.5-flash-lite
    Description: Lighter Gemini model tried after the primary fails (empty = no fallback model)
  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ''
  OpenAqApiKey:
    Type: String
    NoEcho: true
    Default: ''
  AlertEmail:
    Type: String
    Default: ''
    Description: Email that receives CloudWatch alarm notifications (empty = no SNS topic)

Globals:
  Function:
    Runtime: python3.12
    CodeUri: .
    MemorySize: 1024
    Environment:
      Variables:
        STORE: dynamo
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        MODEL_PROVIDER: !Ref ModelProvider
        GEMINI_API_KEY: !Ref GeminiApiKey
        GEMINI_MODEL_ID: !Ref GeminiModelId
        GEMINI_FALLBACK_MODEL_ID: !Ref GeminiFallbackModelId
        AGENT_TIMEOUT_S: '24'
        GEMINI_ATTEMPT_TIMEOUT_S: '10'
        OPENAQ_API_KEY: !Ref OpenAqApiKey
        DATA_GOV_IN_API_KEY: !Ref DataGovInApiKey
        CACHE_TABLE: !Ref CacheTable

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Resources:
  SchoolsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: saans-schools
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: id, AttributeType: S}
      KeySchema:
        - {AttributeName: id, KeyType: HASH}

  CacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: saans-cache
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: key, AttributeType: S}
      KeySchema:
        - {AttributeName: key, KeyType: HASH}

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: ['*']

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref SchoolsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref CacheTable}
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:Converse
                - bedrock:ConverseStream
              Resource: '*'
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY

  DailyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: 06:00 IST daily job - computes and caches today's plan for every school (T19)
      Handler: jobs.daily.handler
      Timeout: 120
      Policies:
        - DynamoDBReadPolicy: {TableName: !Ref SchoolsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref CacheTable}
      Events:
        Daily:
          Type: ScheduleV2
          Properties:
            Name: saans-daily-plan
            ScheduleExpression: cron(0 6 * * ? *)
            ScheduleExpressionTimezone: Asia/Kolkata

  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      TopicName: saans-alerts
      DisplayName: Saans alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: saans-api-errors
      AlarmDescription: Saans API Lambda errors >= 5 in 5 minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref ApiFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref AWS::NoValue]

  DailyErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: saans-daily-errors
      AlarmDescription: Saans daily job Lambda errors >= 5 in 5 minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref DailyFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref AWS::NoValue]

Outputs:
  ApiUrl:
    Description: Base API URL (use as VITE_API_URL)
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  DailyFunctionName:
    Description: Daily job Lambda (aws lambda invoke --function-name <this>)
    Value: !Ref DailyFunction
